name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag in BOTH repositories (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.revisions.outputs.version }}
      server_sha: ${{ steps.revisions.outputs.server_sha }}
      web_sha: ${{ steps.revisions.outputs.web_sha }}
      web_repository: ${{ steps.settings.outputs.web_repository }}
      image_prefix: ${{ steps.settings.outputs.image_prefix }}
    steps:
      - name: Validate release settings
        id: settings
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          WEB_REPOSITORY: ${{ vars.STACKNEST_WEB_REPOSITORY || format('{0}/stack-nest-web', github.repository_owner) }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", tag) or len(tag) > 80:
              raise SystemExit("Use a version such as v1.0.0 or v1.0.0-rc.1")
          repo = os.environ["WEB_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit("Invalid frontend repository")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"web_repository={repo}\nimage_prefix=ghcr.io/{os.environ['OWNER'].lower()}\n")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: server
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ steps.settings.outputs.web_repository }}
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: web
          # Public repos need no extra secret. A private frontend needs read-only access.
          token: ${{ secrets.STACKNEST_WEB_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Pin both source revisions
        id: revisions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "server_sha=$(git -C server rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "web_sha=$(git -C web rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  server-checks:
    needs: prepare
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.prepare.outputs.server_sha }}

  publish:
    needs: [prepare, server-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE_PREFIX: ${{ needs.prepare.outputs.image_prefix }}
      SERVER_SHA: ${{ needs.prepare.outputs.server_sha }}
      WEB_SHA: ${{ needs.prepare.outputs.web_sha }}
      WEB_REPOSITORY: ${{ needs.prepare.outputs.web_repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SERVER_SHA }}
          path: server
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ env.WEB_SHA }}
          path: web
          token: ${{ secrets.STACKNEST_WEB_READ_TOKEN || github.token }}
          persist-credentials: false
      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          url = os.environ["GITHUB_API_URL"] + "/repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/tags/" + os.environ["VERSION"]
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=30):
                  raise SystemExit("This version already has a release; publish a new version instead.")
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit("Unable to verify release availability: HTTP " + str(error.code))
          PY
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - name: Check the pinned frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm check
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build Linux deployment tools
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/stacknest-egress" ./cmd/stacknest-egress
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/stacknest-setup" ./cmd/stacknest-setup
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API and Runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.SERVER_SHA }}
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_PREFIX }}/stacknest-app:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SERVER_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=release-app
          cache-to: type=gha,mode=max,scope=release-app
      - name: Build frontend and Nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ env.WEB_SHA }}
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_PREFIX }}/stacknest-web:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.WEB_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,mode=max,scope=release-web
      - name: Build database migration image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/deploy/migrate/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_PREFIX }}/stacknest-migrate:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SERVER_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
      - name: Check actual images before publishing
        working-directory: server
        run: |
          python3 deploy/check_release.py --image-prefix "$IMAGE_PREFIX" --version "$VERSION"
          python3 deploy/check_nginx.py --image "$IMAGE_PREFIX/stacknest-web:$VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push all images and record registry digests
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          for component in ("app", "web", "migrate"):
              name = os.environ["IMAGE_PREFIX"] + "/stacknest-" + component
              tag = name + ":" + os.environ["VERSION"]
              subprocess.run(["docker", "push", tag], check=True)
              refs = json.loads(subprocess.check_output(["docker", "image", "inspect", "--format", "{{json .RepoDigests}}", tag], text=True))
              ref = next(value for value in refs if value.startswith(name + "@sha256:"))
              with open(os.environ["GITHUB_ENV"], "a") as output:
                  output.write(component.upper() + "_IMAGE=" + ref + "\n")
          PY
      - name: Package deployment files
        working-directory: server
        run: |
          python3 deploy/package_release.py \
            --version "$VERSION" --server-repository "$GITHUB_REPOSITORY" --server-sha "$SERVER_SHA" \
            --web-repository "$WEB_REPOSITORY" --web-sha "$WEB_SHA" \
            --app-image "$APP_IMAGE" --web-image "$WEB_IMAGE" --migrate-image "$MIGRATE_IMAGE" \
            --egress-binary "$RUNNER_TEMP/stacknest-egress" --setup-binary "$RUNNER_TEMP/stacknest-setup" \
            --output "$RUNNER_TEMP/stacknest-release"
      - name: Package deployment CLI for Linux, Windows and macOS
        working-directory: server
        run: python3 deploy/package_cli.py --version "$VERSION" --revision "$SERVER_SHA" --output "$RUNNER_TEMP/stacknest-release"
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$VERSION" "$RUNNER_TEMP/stacknest-release/"* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "StackNest $VERSION" \
            --generate-notes "${flags[@]}"
      - name: Save browser report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-browser-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
