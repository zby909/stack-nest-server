# 可选 Cloudflare Tunnel；同一 Nginx 同时提供本机回源与 SSH 入口。
services:
  nginx:
    ports: !override
      - "127.0.0.1:18080:82"
      - "127.0.0.1:18081:81"
    volumes:
      - ./deploy/nginx/ssh.conf.template:/etc/nginx/templates/ssh.conf.template:ro
      - ./deploy/nginx/cloudflare-tunnel.conf.template:/etc/nginx/templates/cloudflare-tunnel.conf.template:ro
