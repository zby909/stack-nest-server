openapi: 3.0.3
info:
  title: StackNest super administrator network API
  version: 1.0.0
paths:
  /api/network:
    get:
      operationId: GetNetwork
      description: Only the deployment-configured super administrator can read host policy.
      responses:
        '200':
          description: Actual host configuration and readiness
        '401':
          description: Authentication required
        '403':
          description: Super administrator required
        '503':
          description: Host control service is unavailable
    put:
      operationId: UpdateNetwork
      description: Requires same-origin session, super administrator role and expectedRevision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Update'
      responses:
        '200':
          description: Configuration persisted and rules applied; dnsChanged signals redeployment requirement
        '400':
          description: Invalid structured configuration
        '401':
          description: Authentication required
        '403':
          description: Super administrator or trusted request origin required
        '409':
          description: Stale configuration revision
        '503':
          description: Host control service is unavailable
components:
  schemas:
    Update:
      type: object
      required: [config, expectedRevision]
      additionalProperties: false
      properties:
        expectedRevision:
          type: string
        config:
          type: object
          required: [lanInterfaces, blockedCIDRs, allow, dnsServers]
          additionalProperties: false
          properties:
            lanInterfaces:
              type: array
              minItems: 1
              maxItems: 32
              items: {type: string}
            blockedCIDRs:
              type: array
              maxItems: 128
              items: {type: string}
            allow:
              type: array
              maxItems: 128
              items:
                type: object
                additionalProperties: false
                required: [address, port, protocol]
                properties:
                  address: {type: string}
                  port: {type: integer, minimum: 1, maximum: 65535}
                  protocol: {type: string, enum: [tcp, udp]}
            dnsServers:
              type: array
              minItems: 1
              maxItems: 3
              items: {type: string}
