openapi: 3.1.0
info:
  title: StackNest API
  version: 0.10.0
  description: |
    StackNest 项目控制中心后端接口（静态站点与单容器 HTTP 应用）。
    支持邮件验证码登录、邮箱白名单管理、静态项目上传/更新/回退/编辑/导出，以及管理员备份状态。
servers:
  - url: http://localhost:8080
    description: 本地开发环境
security:
  - SecureSessionCookie: []
  - SessionCookie: []
tags:
  - name: Apps
  - name: System
  - name: Projects
  - name: Auth
  - name: Users
paths:
  /api/apps:
    get:
      tags: [Apps]
      operationId: listApps
      summary: 查看自己的 Docker 应用，管理员查看全部
      responses:
        '200':
          description: 应用及资源限额
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/AppList'}
        '401': {description: 未登录}
    post:
      tags: [Apps]
      operationId: createApp
      summary: 排队拉取镜像并部署单个 HTTP 服务
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './components.yaml#/components/schemas/AppInput'}
      responses:
        '202':
          description: 已持久化部署任务
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/AppView'}
        '400': {description: 配置无效}
        '409': {description: 数量、内存配额或标识冲突}
        '503': {description: 运行器不可用或磁盘不足}
  /api/apps/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Apps]
      operationId: getApp
      summary: 查询应用配置与实时容器状态
      responses:
        '200':
          description: 应用详情、运行器可用性和公开配额，环境变量与密码不回显
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/AppDetail'}
        '404': {description: 不存在或无权访问}
    put:
      tags: [Apps]
      operationId: updateApp
      summary: 以 generation 防止并发覆盖，拉取后切换版本
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './components.yaml#/components/schemas/AppInput'}
      responses:
        '202':
          description: 已排队更新
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/AppView'}
        '404': {description: 不存在或无权访问}
        '409': {description: 正在操作或版本冲突}
  /api/apps/{id}/actions:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    post:
      tags: [Apps]
      operationId: operateApp
      summary: 启停、重启、删除应用，或取消尚未开始容器切换的本次部署
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, generation]
              properties:
                action: {type: string, enum: [start, stop, restart, delete, cancel]}
                generation: {type: integer, format: int64}
      responses:
        '202':
          description: 操作已接收；取消仅针对传入代次，不增加代次，执行中的任务安全收尾后解除占用
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/AppView'}
        '404': {description: 不存在或无权访问}
        '409': {description: 正在操作或版本冲突}
  /api/apps/{id}/logs:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Apps]
      operationId: getAppLogs
      summary: 最近 200 行日志，最大 256 KiB，遮盖保存的环境变量值
      responses:
        '200':
          description: 纯文本日志
          content:
            application/json:
              schema:
                type: object
                required: [text]
                properties:
                  text: {type: string}
        '404': {description: 不存在或无权访问}
  /api/projects/{slug}/changes:
    parameters:
      - {$ref: './components.yaml#/components/parameters/ProjectSlug'}
    get:
      tags: [Projects]
      operationId: listProjectChanges
      summary: 比较保留版本之间的文件增删改，内容按 SHA-256 判断
      parameters:
        - {name: deploymentId, in: query, required: true, schema: {type: string}}
        - {name: baseId, in: query, schema: {type: string}, description: 基线版本，首次发布时省略}
      responses:
        '200':
          description: 文件变化
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes: {type: array, items: {$ref: './components.yaml#/components/schemas/FileChange'}}
        '404': {description: 项目不存在或无权访问}
        '409': {description: 版本已清理或文件状态异常}
  /api/projects/{slug}/draft/publish:
    parameters:
      - {$ref: './components.yaml#/components/parameters/ProjectSlug'}
    post:
      tags: [Projects]
      operationId: publishDraft
      summary: 发布指定待发布版本，保留当前正式版供回退
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [draftId, expectedId]
              properties:
                draftId: {type: string}
                expectedId: {type: string, description: 当前正式版编号，首次发布使用空字符串}
      responses:
        '200': {description: 已发布, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Project'}}}}
        '404': {description: 项目不存在或无权访问}
        '409': {description: 正式版或草稿已变化}
  /api/projects/{slug}/draft:
    parameters:
      - {$ref: './components.yaml#/components/parameters/ProjectSlug'}
    delete:
      tags: [Projects]
      operationId: discardDraft
      summary: 丢弃指定待发布版本，正式站点保持原样
      parameters:
        - {name: draftId, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: 已丢弃, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Project'}}}}
        '404': {description: 项目不存在或无权访问}
        '409': {description: 草稿已变化}
  /api/uploads:
    post:
      tags: [Projects]
      summary: 创建或恢复属于当前用户的上传会话
      operationId: createUpload
      description: 分片最大 4 MiB、最小 64 KiB（最后一片可更小），响应通过 minChunkSize 声明小分片能力；90 MiB 文件上限；固定 24 小时过期；每人最多两项、全局八项未完成上传。此接口不是 tus 协议接口。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './components.yaml#/components/schemas/UploadRequest'}
      responses:
        '201': {description: 已创建或恢复, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/UploadStatus'}}}}
        '400': {description: 参数无效}
        '409': {description: 参数或项目版本冲突}
        '429': {description: 上传记录数量达到上限}
        '507': {description: 磁盘空间不足}
  /api/uploads/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      tags: [Projects]
      summary: 查询服务器已提交的上传进度
      operationId: getUpload
      responses:
        '200': {description: 已接收偏移, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/UploadStatus'}}}}
        '404': {description: 不属于当前用户、已过期或不存在}
    patch:
      tags: [Projects]
      summary: 追加一个完整分片
      operationId: appendUpload
      parameters:
        - {name: Upload-Offset, in: header, required: true, schema: {type: integer, format: int64, minimum: 0}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '200': {description: 分片已持久化, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/UploadStatus'}}}}
        '400': {description: 分片长度无效}
        '408': {description: 分片传输中断或超时，已确认进度保留}
        '413': {description: 单个分片超过上限}
        '404': {description: 记录不存在或不属于当前用户}
        '409': {description: 偏移冲突，应重新查询进度}
        '429': {description: 其他分片正在传输，可稍后重试}
        '507': {description: 磁盘空间不足}
    delete:
      tags: [Projects]
      summary: 放弃临时上传，不删除已发布项目
      operationId: deleteUpload
      responses:
        '204': {description: 已删除或原记录不存在}
  /api/uploads/{id}/complete:
    post:
      tags: [Projects]
      summary: 验证完整文件摘要并幂等发布
      operationId: completeUpload
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 已发布，重复请求不会再次切换版本, content: {application/json: {schema: {$ref: './components.yaml#/components/schemas/Project'}}}}
        '400': {description: 归档无效}
        '404': {description: 上传或项目不存在}
        '409': {description: 文件未传完、项目版本变化或本次上传的版本已不再保留}
        '422': {description: SHA-256 校验失败}
        '429': {description: 另一个发布正在处理}
  /api/projects/{slug}/files:
    get:
      tags: [Projects]
      summary: 查看当前版或上一版的文件相对路径与大小
      operationId: listProjectFiles
      parameters:
        - {$ref: './components.yaml#/components/parameters/ProjectSlug'}
        - {name: deploymentId, in: query, required: true, schema: {type: string}}
      responses:
        '200':
          description: 完整文件清单，不读取文件内容
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: {$ref: './components.yaml#/components/schemas/PublishedFile'}
        '404': {description: 无权访问或项目不存在}
        '409': {description: 版本变化或文件异常}
  /api/storage:
    get:
      tags: [System]
      summary: 查询上传限制；磁盘详情仅管理员可见
      operationId: getStorage
      responses:
        '200':
          description: 数据卷可用空间与本次可否上传
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/StorageStatus'
        '503':
          description: 无法检查磁盘，暂停上传
  /api/system:
    get:
      tags: [System]
      summary: 管理员查询服务器 CPU、内存和数据卷状态
      operationId: getSystem
      responses:
        '200':
          description: 服务器状态
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/SystemStatus'
        '403':
          description: 仅管理员可访问
        '503':
          description: 暂时无法读取服务器状态
  /api/backups/status:
    get:
      tags: [System]
      summary: 管理员查询最近备份结果与体积
      operationId: getBackupStatus
      description: 只读取安全摘要；运行超过 45 分钟视为可能中断，成功备份超过 48 小时提示检查任务。
      responses:
        '200':
          description: 备份状态，未配置或无记录也会明确返回
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/BackupStatus'}
        '401': {description: 未登录}
        '403': {description: 仅管理员可访问}
        '503': {description: 状态文件损坏或暂时不可读取}
  /api/activity:
    get:
      tags: [System]
      summary: 在保留的操作日志中筛选和分页，先校验可见范围
      operationId: getActivity
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 100000, default: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: slug, in: query, schema: {type: string, maxLength: 52}}
        - {name: action, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string, maxLength: 254}}
        - {name: q, in: query, schema: {type: string, maxLength: 256}}
        - {name: from, in: query, description: 包含此时间, schema: {type: string, format: date-time}}
        - {name: to, in: query, description: 不包含此时间, schema: {type: string, format: date-time}}
      responses:
        '400': {description: 筛选参数或时间范围无效}
        '200':
          description: 操作日志，按新到旧排序
          content:
            application/json:
              schema:
                type: object
                required: [events, total, page, pageSize]
                properties:
                  total: {type: integer}
                  page: {type: integer}
                  pageSize: {type: integer}
                  events:
                    type: array
                    items:
                      $ref: './components.yaml#/components/schemas/ActivityEvent'
  /api/auth/request-code:
    post:
      security: []
      tags: [Auth]
      summary: 请求一次性登录验证码
      operationId: requestLoginCode
      description: 对未知邮箱也返回相同结果；每个邮箱每 60 秒最多发一次。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/EmailRequest'
      responses:
        '202':
          description: 如果邮箱已获准登录且未触发限流，验证码将发送至该邮箱
        '400':
          description: 邮箱格式无效
        '429':
          description: 请求过于频繁
  /api/auth/verify:
    post:
      security: []
      tags: [Auth]
      summary: 用邮件验证码登录
      operationId: verifyLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/VerifyCodeRequest'
      responses:
        '200':
          description: 登录成功，设置 HttpOnly 会话 Cookie
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AuthUser'
        '400':
          description: 验证码错误或过期
  /api/auth/session:
    get:
      tags: [Auth]
      summary: 查询当前登录用户
      operationId: getAuthSession
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AuthUser'
        '401':
          description: 未登录或会话过期
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前会话
      operationId: logout
      responses:
        '204':
          description: 已注销
  /api/users:
    get:
      tags: [Users]
      summary: 管理员查询允许登录的邮箱
      operationId: listUsers
      responses:
        '200':
          description: 邮箱列表
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/UserListResponse'
        '403':
          description: 仅管理员可访问
    post:
      tags: [Users]
      summary: 管理员添加普通用户邮箱
      operationId: addUser
      description: 默认只添加邮箱；sendInvitation 为 true 时在添加成功后尝试发送邀请。发信失败仍返回 201 并保留邮箱，invitation 表示发送结果。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/AddUserRequest'
      responses:
        '201':
          description: 邮箱添加成功；邀请未请求、已被 SMTP 接受或发送未能确认
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/AddUserResponse'
        '400':
          description: 邮箱或请求格式无效
        '403':
          description: 仅管理员可访问
        '409':
          description: 邮箱已存在
        '503':
          description: 请求发邀请但未配置可用的 HTTPS 登录地址；不会添加邮箱
  /api/users/{id}:
    delete:
      tags: [Users]
      summary: 管理员删除普通用户邮箱并撤销其会话
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 删除成功
        '403':
          description: 仅管理员可访问或目标是管理员
        '404':
          description: 用户不存在
  /api/health:
    get:
      security: []
      tags: [System]
      summary: API 与数据库连接就绪检查
      operationId: getHealth
      description: 最多用 2 秒探测数据库连接；无需登录，响应禁止缓存且不包含连接详情。不检查数据库迁移、SMTP 或每个站点。
      responses:
        '200':
          description: API 正常响应且数据库连接可用
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/HealthResponse'
        '503':
          description: 数据库连接不可用、探测超时或尚未配置探测
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/HealthResponse'
  /openapi.yaml:
    get:
      security: []
      tags: [System]
      summary: 获取 OpenAPI 接口契约
      operationId: getOpenAPISpec
      responses:
        '200':
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/projects:
    get:
      tags: [Projects]
      summary: 获取项目列表
      operationId: listProjects
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ProjectListResponse'
    post:
      tags: [Projects]
      summary: 创建并部署静态项目
      operationId: createProject
      description: |
        上传 ZIP、RAR 或单个 HTML（.html / .htm）静态站点。单 HTML 原样保存为 index.html，原文件名保留在版本记录；压缩包根目录或唯一一级目录必须包含 index.html。
        当前限制：
        - 压缩包最大 90 MiB（94371840 字节）
        - 解压后最大 200 MiB（209715200 字节），按实际读取字节限制
        - 磁盘已使用或加上 412 MiB 处理预算后达到 90% 时拒绝上传
        - 最多 5000 个文件或目录条目
        - 不允许软链接、硬链接及特殊文件
        - 不允许路径穿越
        - RAR 仅支持未加密的单卷文件，解码字典最大 64 MiB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                  minLength: 1
                  description: UTF-8 编码最多 256 字节
                slug:
                  type: string
                  pattern: '^[a-z0-9](?:[a-z0-9-]{0,50}[a-z0-9])?$'
                  maxLength: 52
                  description: 为空时由项目名称自动生成；手填时必须满足 DNS 标签规则
                description:
                  type: string
                  description: UTF-8 编码最多 4096 字节
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/Project'
        '400':
          description: 参数或压缩包不合法
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ErrorResponse'
        '409':
          description: slug 已存在
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ErrorResponse'
        '413':
          description: 上传归档或请求体超过限制
        '429':
          description: 另一个上传正在处理
        '503':
          description: 无法确认磁盘空间，暂时拒绝上传
        '507':
          description: 磁盘达到 90% 或不足以容纳上传和解压暂存
        '500':
          description: 内部发布错误
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ErrorResponse'
  /api/projects/{slug}:
    parameters:
      - $ref: './components.yaml#/components/parameters/ProjectSlug'
    patch:
      tags: [Projects]
      summary: 编辑项目名称和说明
      operationId: editProject
      description: 仅项目所有者及管理员可编辑。slug、归属、网址和部署文件保持不变；旧页面返回 409，需刷新列表后重试。
      parameters:
        - $ref: './components.yaml#/components/parameters/MetadataVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: './components.yaml#/components/schemas/EditProjectRequest'}
      responses:
        '200':
          description: 编辑后的项目
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/Project'}
        '400': {description: 字段或更新时间无效}
        '401': {description: 未登录}
        '404': {description: 项目不存在或无权操作}
        '409': {description: 项目信息已变化}
        '415': {description: 请求不是 JSON}
    get:
      tags: [Projects]
      summary: 获取项目详情
      operationId: getProject
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/Project'
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ErrorResponse'
    delete:
      tags: [Projects]
      summary: 删除项目
      operationId: deleteProject
      responses:
        '204':
          description: 删除成功
        '404':
          description: 项目不存在
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ErrorResponse'
        '500':
          description: 删除失败
          content:
            application/json:
              schema:
                $ref: './components.yaml#/components/schemas/ErrorResponse'
  /api/projects/{slug}/access:
    parameters:
      - $ref: './components.yaml#/components/parameters/ProjectSlug'
      - $ref: './components.yaml#/components/parameters/MetadataVersion'
    put:
      tags: [Projects]
      summary: 暂停或恢复站点访问，保留文件、版本和地址
      operationId: setProjectAccess
      description: 所有者和管理员可操作。暂停时页面和资源返回 503；更新、回退不会恢复访问。缓存过的内容无法撤回。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [paused]
              properties:
                paused: {type: boolean}
      responses:
        '200':
          description: 当前项目及访问状态
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/Project'}
        '400': {description: 参数或版本无效}
        '401': {description: 未登录}
        '404': {description: 项目不存在或无权操作}
        '409': {description: 项目已变化，请刷新后重试}
        '500': {description: 状态未能同步，刷新重试或重启恢复}
  /api/projects/{slug}/export:
    parameters:
      - $ref: './components.yaml#/components/parameters/ProjectSlug'
    get:
      tags: [Projects]
      summary: 将当前版或上一版部署文件导出为 ZIP
      operationId: exportProject
      description: |
        仅项目所有者及管理员可导出。只包含解压后的部署文件，不是原始上传包或源代码仓库。
        deploymentId 必须是仍保留的部署编号，失效返回 409。生成快照时与发布串行，传输阶段允许继续更新。
        单次最多 200 MiB 部署文件、5000 个文件，ZIP 临时文件最多额外预留 16 MiB；磁盘 90% 阈值仍生效。
        同实例仅允许一个导出请求，传输最多 10 分钟；连接结束清理快照，进程重启清理残留。
      parameters:
        - name: deploymentId
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: 部署文件 ZIP，Content-Disposition 为附件
          content:
            application/zip:
              schema: {type: string, format: binary}
        '206': {description: ZIP 部分内容}
        '400': {description: 参数无效}
        '401': {description: 未登录}
        '404': {description: 项目不存在或无权操作}
        '409': {description: 部署版本不再保留或文件异常}
        '429': {description: 另一个导出正在处理}
        '503': {description: 无法检查磁盘}
        '507': {description: 剩余空间不足以生成 ZIP}
  /api/projects/{slug}/deployments:
    parameters:
      - $ref: './components.yaml#/components/parameters/ProjectSlug'
      - $ref: './components.yaml#/components/parameters/DeploymentVersion'
    post:
      tags: [Projects]
      summary: 更新已有项目，保留原网址及上一版
      operationId: updateProject
      description: |
        仅管理员和项目所有者可以更新。支持 ZIP/RAR 或单个 HTML；沿用创建项目的上传、磁盘和发布大小限制。
        新包完成验证后切换，保留当前版和上一版；更早文件和部署记录被清理，操作日志仍保留。
        If-Match 必须是页面上当前部署的带双引号 ID，过期请求返回 409。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: 更新后的项目
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/Project'}
        '400': {description: 请求或归档无效}
        '401': {description: 未登录}
        '404': {description: 项目不存在或无权操作}
        '409': {description: 当前版本变化或有待恢复的文件事务}
        '413': {description: 上传超过限制}
        '429': {description: 另一个发布正在处理}
        '503': {description: 无法检查磁盘空间}
        '507': {description: 磁盘空间不足或达到限制}
        '500': {description: 发布失败或提交结果需要恢复确认}
  /api/projects/{slug}/rollback:
    parameters:
      - $ref: './components.yaml#/components/parameters/ProjectSlug'
      - $ref: './components.yaml#/components/parameters/DeploymentVersion'
    post:
      tags: [Projects]
      summary: 回退至上一版，原当前版成为新的上一版
      operationId: rollbackProject
      description: 不重复解压和复制文件。归属检查和 If-Match 与更新接口相同。
      responses:
        '200':
          description: 回退后的项目
          content:
            application/json:
              schema: {$ref: './components.yaml#/components/schemas/Project'}
        '400': {description: 缺少有效的 If-Match}
        '401': {description: 未登录}
        '404': {description: 项目不存在或无权操作}
        '409': {description: 无上一版、当前版本变化或有待恢复的文件事务}
        '429': {description: 另一个发布正在处理}
        '500': {description: 回退失败或提交结果需要恢复确认}
components:
  securitySchemes:
    SecureSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-stacknest_session
      description: HTTPS 登录设置的 Secure、HttpOnly、SameSite=Strict 主机会话 Cookie，Path=/ 且不设置 Domain；HTTPS 不接受旧名称。
    SessionCookie:
      type: apiKey
      in: cookie
      name: stacknest_session
      description: 仅用于本地 HTTP 开发或 SSH 入口的 HttpOnly 会话 Cookie；公网使用 HTTPS 和 SecureSessionCookie。
